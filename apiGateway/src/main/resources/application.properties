server.port=8080
spring.application.name=api-gateway

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.client.registry-fetch-interval-seconds=3

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Ordered Gateway Routes (Specific routes first!)
# 0: Customer Products
spring.cloud.gateway.routes[0].id=customer-products
spring.cloud.gateway.routes[0].uri=lb://PRODUCT-WARRANTY-PURCHASE-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/customers/me/products

# 1: Customer Service Requests
spring.cloud.gateway.routes[1].id=customer-service-requests
spring.cloud.gateway.routes[1].uri=lb://SERVICE-REQUEST-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/customers/service-requests

# 2: Company Service Requests
spring.cloud.gateway.routes[2].id=company-service-requests
spring.cloud.gateway.routes[2].uri=lb://SERVICE-REQUEST-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/company/service-requests

# 3: Auth
spring.cloud.gateway.routes[3].id=auth
spring.cloud.gateway.routes[3].uri=lb://CUSTOMER-COMPANY-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/auth/**

# 4: Companies
spring.cloud.gateway.routes[4].id=companies
spring.cloud.gateway.routes[4].uri=lb://CUSTOMER-COMPANY-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/companies/**

# 5: Purchases
spring.cloud.gateway.routes[5].id=purchases
spring.cloud.gateway.routes[5].uri=lb://PRODUCT-WARRANTY-PURCHASE-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/purchases/**

# 6: Service Requests
spring.cloud.gateway.routes[6].id=service-requests
spring.cloud.gateway.routes[6].uri=lb://SERVICE-REQUEST-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/service-requests/**

# 7: Customers fallback
spring.cloud.gateway.routes[7].id=customers
spring.cloud.gateway.routes[7].uri=lb://CUSTOMER-COMPANY-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/customers/**

# 8: Health
spring.cloud.gateway.routes[8].id=health
spring.cloud.gateway.routes[8].uri=lb://CUSTOMER-COMPANY-SERVICE
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/health

# Webflux fallback mapping
spring.cloud.gateway.server.webflux.routes[0].id=customer-products
spring.cloud.gateway.server.webflux.routes[0].uri=lb://PRODUCT-WARRANTY-PURCHASE-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/customers/me/products

spring.cloud.gateway.server.webflux.routes[1].id=customer-service-requests
spring.cloud.gateway.server.webflux.routes[1].uri=lb://SERVICE-REQUEST-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/customers/service-requests

spring.cloud.gateway.server.webflux.routes[2].id=company-service-requests
spring.cloud.gateway.server.webflux.routes[2].uri=lb://SERVICE-REQUEST-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/company/service-requests

spring.cloud.gateway.server.webflux.routes[3].id=auth
spring.cloud.gateway.server.webflux.routes[3].uri=lb://CUSTOMER-COMPANY-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[4].id=companies
spring.cloud.gateway.server.webflux.routes[4].uri=lb://CUSTOMER-COMPANY-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/companies/**

spring.cloud.gateway.server.webflux.routes[5].id=purchases
spring.cloud.gateway.server.webflux.routes[5].uri=lb://PRODUCT-WARRANTY-PURCHASE-SERVICE
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/purchases/**

spring.cloud.gateway.server.webflux.routes[6].id=service-requests
spring.cloud.gateway.server.webflux.routes[6].uri=lb://SERVICE-REQUEST-SERVICE
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/service-requests/**

spring.cloud.gateway.server.webflux.routes[7].id=customers
spring.cloud.gateway.server.webflux.routes[7].uri=lb://CUSTOMER-COMPANY-SERVICE
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/customers/**

spring.cloud.gateway.server.webflux.routes[8].id=health
spring.cloud.gateway.server.webflux.routes[8].uri=lb://CUSTOMER-COMPANY-SERVICE
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/api/health

# Global CORS Configuration - Allow All Origins
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
